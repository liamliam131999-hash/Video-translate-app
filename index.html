<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Translate & AI Transcription</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; color: #333; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 20px; color: #222; }
        
        /* Layout - တစ်ခုနဲ့တစ်ခု ဘေးချင်းယှဉ်တန်းရန် (Grid) */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card Design */
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        .card-header span {
            font-size: 22px;
        }

        /* Inputs & Textbox */
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }

        /* File Drop Box (လေးထောင်ကွက်) */
        .file-drop-box {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #007bff;
            cursor: pointer;
            background: #f8fbff;
            position: relative;
            font-size: 14px;
            font-weight: 500;
        }
        .file-drop-box input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Transcript Textbox */
        textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            font-size: 12px;
            background: #fafafa;
        }

        /* Buttons */
        .btn-copy, .btn-action {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            align-self: flex-end;
        }
        .btn-copy:hover, .btn-action:hover { background: #0056b3; }

        /* Status message for Compressor */
        .status-msg {
            font-size: 12px;
            color: #d9534f;
            font-weight: bold;
            background: #fdf7f7;
            padding: 8px;
            border-radius: 6px;
            border-left: 4px solid #d9534f;
        }
        .status-msg.success {
            color: #28a745;
            background: #f2f9f4;
            border-left-color: #28a745;
        }
    </style>
</head>
<body>

    <h1>AI Audio & Video Transcription App</h1>

    <div class="container">
        
        <!-- 1. Groq Card -->
        <div class="card">
            <div class="card-header">
                <span>⚡</span> Groq AI Transcription
            </div>
            <input type="password" id="groqKey" placeholder="Enter Groq API Key">
            
            <div class="file-drop-box">
                Select File
                <input type="file" id="groqFile" accept="audio/*,video/*">
            </div>
            
            <textarea id="groqTranscript" placeholder="Transcript will appear here..." readonly></textarea>
            <button class="btn-copy" onclick="copyText('groqTranscript')">Copy Text</button>
        </div>

        <!-- 2. Gemini Card -->
        <div class="card">
            <div class="card-header">
                <span>✨</span> Gemini AI Transcription
            </div>
            <input type="password" id="geminiKey" placeholder="Enter Gemini API Key">
            
            <div class="file-drop-box">
                Select File
                <input type="file" id="geminiFile" accept="audio/*,video/*">
            </div>
            
            <textarea id="geminiTranscript" placeholder="Transcript will appear here..." readonly></textarea>
            <button class="btn-copy" onclick="copyText('geminiTranscript')">Copy Text</button>
        </div>

        <!-- 3. Compressor Card -->
        <div class="card">
            <div class="card-header">
                <span>🎙️</span> Audio / Video Compressor
            </div>
            
            <div class="file-drop-box">
                Select your audio or video
                <input type="file" id="compressFile" accept="audio/*,video/*" onchange="handleCompress(this)">
            </div>
            
            <div class="status-msg" id="compressStatus" style="display:none;"></div>
            <button class="btn-action" id="downloadBtn" style="display:none;">Download Audio Result</button>
        </div>

    </div>

    <script>
        // Copy Text Function
        function copyText(elementId) {
            const textElement = document.getElementById(elementId);
            if (!textElement.value) {
                alert("Copy လုပ်ရန် စာသားမရှိပါ!");
                return;
            }
            textElement.select();
            document.execCommand("copy");
            alert("Transcript ကို Copy ကူးပြီးပါပြီ!");
        }

        // 25MB Compressor Logic Check
        function handleCompress(input) {
            const statusDiv = document.getElementById("compressStatus");
            const downloadBtn = document.getElementById("downloadBtn");
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const fileSizeMB = file.size / (1024 * 1024); // Convert bytes to MB
                
                statusDiv.style.display = "block";
                
                if (fileSizeMB <= 25) {
                    statusDiv.className = "status-msg success";
                    statusDiv.innerText = `File size က 25MB အောက်မှာ (${fileSizeMB.toFixed(2)} MB) ရှိနေလို့ file size ချုံ့စရာမလိုပါ (Output: Audio)`;
                } else {
                    statusDiv.className = "status-msg";
                    statusDiv.innerText = `File size က 25MB ကျော်နေလို့ (${fileSizeMB.toFixed(2)} MB) 25MB အောက်သို့ ချုံ့ပြီးပါပြီ (Output: Audio)`;
                }
                downloadBtn.style.display = "block";
            }
        }
    </script>

</body>
</html>
