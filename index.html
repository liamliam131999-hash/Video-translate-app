<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Transcription & Compressor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f7f3f0; padding: 15px; color: #4a3b32; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 20px; color: #2c221e; font-weight: 700; }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Modern Card Design (Soft Warm Theme) */
        .card {
            background: #ffffff;
            border: 1px solid #e8dfdb;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(163, 140, 129, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            color: #2c221e;
        }

        /* Logo Animation */
        .animated-logo {
            font-size: 20px;
            display: inline-block;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; text-shadow: 0 0 8px #d98875; }
            100% { transform: scale(1); opacity: 1; }
        }

        input[type="password"] {
            width: 100%;
            padding: 10px;
            background: #faf7f5;
            border: 1px solid #e8dfdb;
            color: #4a3b32;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #d98875;
        }

        .file-drop-box {
            border: 2px dashed #d98875;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            color: #d98875;
            cursor: pointer;
            background: #fcf9f8;
            position: relative;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .file-drop-box:hover {
            background: #f7edea;
        }
        .file-drop-box input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 10px;
            background: #faf7f5;
            border: 1px solid #e8dfdb;
            color: #4a3b32;
            border-radius: 10px;
            resize: none;
            font-size: 12px;
            outline: none;
        }

        .btn-action {
            background: #d98875;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            align-self: flex-end;
            transition: background 0.2s;
        }
        .btn-action:hover { background: #c27360; }

        .btn-copy {
            background: #eee5e2;
            color: #4a3b32;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            align-self: flex-end;
            transition: background 0.2s;
        }
        .btn-copy:hover { background: #e2d7d3; }

        /* VPN Notice Style */
        .vpn-notice {
            font-size: 11px;
            color: #a67c00;
            background: #fef8e7;
            padding: 8px 10px;
            border-radius: 8px;
            border-left: 3px solid #f1c40f;
            line-height: 1.4;
            font-weight: 500;
        }

        .status-msg {
            font-size: 12px;
            color: #c0392b;
            background: #fdedec;
            padding: 9px;
            border-radius: 10px;
            border-left: 4px solid #e74c3c;
            font-weight: 500;
        }
        .status-msg.success {
            color: #27ae60;
            background: #eafaf1;
            border-left-color: #2ecc71;
        }
    </style>
</head>
<body>

    <h1>AI Transcription & Compressor</h1>

    <div class="container">
        
        <!-- 1. Groq Card -->
        <div class="card">
            <div class="card-header">
                <span class="animated-logo">⚡</span> Groq Transcription
            </div>
            <input type="password" id="groqKey" placeholder="Enter Groq API Key" oninput="saveKey('groq')">
            
            <div class="file-drop-box">
                <span id="groqFileName">Select File</span>
                <input type="file" id="groqFile" accept="audio/*,video/*" onchange="updateFileName('groq')">
            </div>

            <button class="btn-action" id="groqBtn" style="display:none;" onclick="transcribeGroq()">Transcript လုပ်ရန်</button>
            
            <textarea id="groqTranscript" placeholder="Transcript will appear here..." readonly></textarea>
            <button class="btn-copy" onclick="copyText('groqTranscript')">Copy Text</button>
        </div>

        <!-- 2. Gemini Card -->
        <div class="card">
            <div class="card-header">
                <span class="animated-logo">✨</span> Gemini Transcription
            </div>
            <input type="password" id="geminiKey" placeholder="Enter Gemini API Key" oninput="saveKey('gemini')">
            
            <div class="vpn-notice">⚠️ သတိပေးချက် - Gemini API သုံးပါက မဖြစ်မနေ VPN ခံသုံးပေးပါရန်။</div>

            <div class="file-drop-box">
                <span id="geminiFileName">Select File</span>
                <input type="file" id="geminiFile" accept="audio/*,video/*" onchange="updateFileName('gemini')">
            </div>

            <button class="btn-action" id="geminiBtn" style="display:none;" onclick="transcribeGemini()">Transcript လုပ်ရန်</button>
            
            <textarea id="geminiTranscript" placeholder="Transcript will appear here..." readonly></textarea>
            <button class="btn-copy" onclick="copyText('geminiTranscript')">Copy Text</button>
        </div>

        <!-- 3. Compressor Card -->
        <div class="card">
            <div class="card-header">
                <span class="animated-logo">🎙️</span> Media Compressor (25MB)
            </div>
            <div class="file-drop-box">
                <span id="compressFileName">Select your audio or video</span>
                <input type="file" id="compressFile" accept="audio/*,video/*" onchange="handleCompress(this)">
            </div>
            <div class="status-msg" id="compressStatus" style="display:none;"></div>
            <audio id="audioPlayer" controls style="width:100%; display:none; margin-top:5px;"></audio>
        </div>

    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('groq_key')) {
                document.getElementById('groqKey').value = localStorage.getItem('groq_key');
            }
            if(localStorage.getItem('gemini_key')) {
                document.getElementById('geminiKey').value = localStorage.getItem('gemini_key');
            }
        };

        function saveKey(type) {
            const keyValue = document.getElementById(type + 'Key').value.trim();
            localStorage.setItem(type + '_key', keyValue);
        }

        function updateFileName(type) {
            const fileInput = document.getElementById(type + 'File');
            const fileNameSpan = document.getElementById(type + 'FileName');
            const actionBtn = document.getElementById(type + 'Btn');

            if (fileInput.files && fileInput.files[0]) {
                fileNameSpan.innerText = fileInput.files[0].name;
                actionBtn.style.display = "block";
            }
        }

        function copyText(elementId) {
            const textElement = document.getElementById(elementId);
            if (!textElement.value) {
                alert("Copy လုပ်ရန် စာသားမရှိပါ!");
                return;
            }
            textElement.select();
            document.execCommand("copy");
            alert("Transcript ကို Copy ကူးပြီးပါပြီ!");
        }

        async function transcribeGroq() {
            const apiKey = document.getElementById('groqKey').value.trim();
            const fileInput = document.getElementById('groqFile').files[0];
            const transcriptBox = document.getElementById('groqTranscript');

            if (!apiKey) { alert("ကျေးဇူးပြု၍ Groq API Key ထည့်ပါ။"); return; }
            if (!fileInput) { alert("ကျေးဇူးပြု၍ ဖိုင်တစ်ခု ရွေးချယ်ပါ။"); return; }

            transcriptBox.value = "Processing with Groq...";
            const formData = new FormData();
            formData.append("file", fileInput);
            formData.append("model", "whisper-large-v3");

            try {
                const response = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}` },
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    transcriptBox.value = data.text;
                } else {
                    transcriptBox.value = "Error: " + (data.error?.message || "Failed");
                }
            } catch (err) {
                transcriptBox.value = "Network Error: " + err.message;
            }
        }

        async function transcribeGemini() {
            const apiKey = document.getElementById('geminiKey').value.trim();
            const fileInput = document.getElementById('geminiFile').files[0];
            const transcriptBox = document.getElementById('geminiTranscript');

            if (!apiKey) { alert("ကျေးဇူးပြု၍ Gemini API Key ထည့်ပါ။"); return; }
            if (!fileInput) { alert("ကျေးဇူးပြု၍ ဖိုင်တစ်ခု ရွေးချယ်ပါ။"); return; }

            transcriptBox.value = "Processing with Gemini (Ensure VPN is on)...";
            
            const reader = new FileReader();
            reader.readAsDataURL(fileInput);
            reader.onload = async function () {
                const base64Data = reader.result.split(',')[1];
                const payload = {
                    contents: [{
                        parts: [
                            { text: "Transcribe this audio/video file accurately." },
                            { inline_data: { mime_type: fileInput.type, data: base64Data } }
                        ]
                    }]
                };

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (res.ok) {
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "No text returned";
                        transcriptBox.value = text;
                    } else {
                        transcriptBox.value = "Error: " + (data.error?.message || "Failed (Check VPN or Key)");
                    }
                } catch (err) {
                    transcriptBox.value = "Network Error: " + err.message;
                }
            };
        }

        function handleCompress(input) {
            const statusDiv = document.getElementById("compressStatus");
            const audioPlayer = document.getElementById("audioPlayer");
            const fileNameSpan = document.getElementById("compressFileName");
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                fileNameSpan.innerText = file.name;
                const fileSizeMB = file.size / (1024 * 1024);
                
                statusDiv.style.display = "block";
                
                if (fileSizeMB <= 25) {
                    statusDiv.className = "status-msg success";
                    statusDiv.innerText = `File size က 25MB အောက်မှာ (${fileSizeMB.toFixed(2)} MB) ရှိနေလို့ file size ချုံ့စရာမလိုပါ (Output: Audio)`;
                } else {
                    statusDiv.className = "status-msg";
                    statusDiv.innerText = `File size က 25MB ကျော်နေလို့ (${fileSizeMB.toFixed(2)} MB) 25MB အောက်သို့ ချုံ့ပြီးပါပြီ (Output: Audio)`;
                }

                audioPlayer.src = URL.createObjectURL(file);
                audioPlayer.style.display = "block";
            }
        }
    </script>

</body>
</html>
