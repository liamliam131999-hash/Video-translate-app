<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Transcription & Media Compressor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; padding: 10px; color: #e0e0e0; }
        h1 { text-align: center; margin-bottom: 15px; font-size: 18px; color: #ffffff; }
        
        /* Layout - မျက်နှာပြင်အလိုက် သပ်ရပ်စွာ ပေါ်စေရန် */
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Dark Card Design */
        .card {
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 15px;
            color: #ffffff;
        }

        .card-header span {
            font-size: 18px;
        }

        /* Inputs & Textbox (Dark) */
        input[type="password"] {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
        }

        /* File Drop Box */
        .file-drop-box {
            border: 2px dashed #00bcd4;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            color: #00bcd4;
            cursor: pointer;
            background: #182224;
            position: relative;
            font-size: 13px;
            font-weight: 500;
        }
        .file-drop-box input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Transcript Textbox (Dark) */
        textarea {
            width: 100%;
            height: 65px;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            resize: none;
            font-size: 12px;
        }

        /* Buttons */
        .btn-copy, .btn-action {
            background: #00bcd4;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            align-self: flex-end;
        }
        .btn-copy:hover, .btn-action:hover { background: #008ba3; color: #fff; }

        /* Status message for Compressor */
        .status-msg {
            font-size: 11px;
            color: #ff5252;
            font-weight: bold;
            background: #2c1a1a;
            padding: 6px;
            border-radius: 6px;
            border-left: 3px solid #ff5252;
        }
        .status-msg.success {
            color: #4caf50;
            background: #1a2c1a;
            border-left-color: #4caf50;
        }
    </style>
</head>
<body>

    <h1>AI Transcription & Compressor</h1>

    <div class="container">
        
        <!-- 1. Groq Card -->
        <div class="card">
            <div class="card-header">
                <span>⚡</span> Groq AI Transcription
            </div>
            <input type="password" id="groqKey" placeholder="Enter Groq API Key">
            
            <div class="file-drop-box">
                Select File
                <input type="file" id="groqFile" accept="audio/*,video/*">
            </div>
            
            <textarea id="groqTranscript" placeholder="Transcript will appear here..." readonly></textarea>
            <button class="btn-copy" onclick="copyText('groqTranscript')">Copy Text</button>
        </div>

        <!-- 2. Gemini Card -->
        <div class="card">
            <div class="card-header">
                <span>✨</span> Gemini AI Transcription
            </div>
            <input type="password" id="geminiKey" placeholder="Enter Gemini API Key">
            
            <div class="file-drop-box">
                Select File
                <input type="file" id="geminiFile" accept="audio/*,video/*">
            </div>
            
            <textarea id="geminiTranscript" placeholder="Transcript will appear here..." readonly></textarea>
            <button class="btn-copy" onclick="copyText('geminiTranscript')">Copy Text</button>
        </div>

        <!-- 3. Compressor Card -->
        <div class="card">
            <div class="card-header">
                <span>🎙️</span> Audio / Video Compressor
            </div>
            
            <div class="file-drop-box">
                Select your audio or video
                <input type="file" id="compressFile" accept="audio/*,video/*" onchange="handleCompress(this)">
            </div>
            
            <div class="status-msg" id="compressStatus" style="display:none;"></div>
            <button class="btn-action" id="downloadBtn" style="display:none;">Download Audio Result</button>
        </div>

    </div>

    <script>
        function copyText(elementId) {
            const textElement = document.getElementById(elementId);
            if (!textElement.value) {
                alert("Copy လုပ်ရန် စာသားမရှိပါ!");
                return;
            }
            textElement.select();
            document.execCommand("copy");
            alert("Transcript ကို Copy ကူးပြီးပါပြီ!");
        }

        function handleCompress(input) {
            const statusDiv = document.getElementById("compressStatus");
            const downloadBtn = document.getElementById("downloadBtn");
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const fileSizeMB = file.size / (1024 * 1024);
                
                statusDiv.style.display = "block";
                
                if (fileSizeMB <= 25) {
                    statusDiv.className = "status-msg success";
                    statusDiv.innerText = `File size က 25MB အောက်မှာ (${fileSizeMB.toFixed(2)} MB) ရှိနေလို့ file size ချုံ့စရာမလိုပါ (Output: Audio)`;
                } else {
                    statusDiv.className = "status-msg";
                    statusDiv.innerText = `File size က 25MB ကျော်နေလို့ (${fileSizeMB.toFixed(2)} MB) 25MB အောက်သို့ ချုံ့ပြီးပါပြီ (Output: Audio)`;
                }
                downloadBtn.style.display = "block";
            }
        }
    </script>

</body>
</html>
